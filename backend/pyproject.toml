[project]
name = "gestor-gastos-backend"
version = "0.1.0"
description = "Backend del MVP Gestor de Gastos"
requires-python = ">=3.12,<3.13"
dependencies = [
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.5,<3",
  "pyjwt>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
audio = ["faster-whisper>=1.1,<2"]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "audio_eval: evaluación opt-in del corpus fijo de audio",
  "performance: prueba opt-in de rendimiento",
]
