openapi: 3.1.0
info:
  title: Gestor de Gastos MVP API
  version: 1.0.0
  description: >-
    Contrato HTTP entre el frontend React y el backend. Todos los importes son strings
    decimales canónicos con dos posiciones; nunca son números JSON.
servers:
  - url: /api
security:
  - cookieAuth: []
tags:
  - name: Auth
  - name: Boards
  - name: People
  - name: Expenses
  - name: Monthly
  - name: Savings
  - name: Audio

paths:
  /health:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Process and database are reachable
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok

  /auth/register:
    post:
      tags: [Auth]
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: >-
            Session created. Sets access_token as HttpOnly, SameSite=Lax cookie;
            Secure is enabled outside local development.
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        "204":
          description: Current session revoked and cookie cleared
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/password-recovery:
    post:
      tags: [Auth]
      security: []
      operationId: requestPasswordRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Generic accepted response whether or not the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/password-reset:
    post:
      tags: [Auth]
      security: []
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                  minLength: 40
                new_password:
                  type: string
                  minLength: 8
      responses:
        "204":
          description: Password replaced, token consumed and active sessions revoked
        "400":
          $ref: "#/components/responses/InvalidToken"
        "422":
          $ref: "#/components/responses/ValidationError"

  /boards:
    get:
      tags: [Boards]
      operationId: listBoards
      responses:
        "200":
          description: Boards where current user is a member
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Board"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Boards]
      operationId: createBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "201":
          description: Board created and creator joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "422":
          $ref: "#/components/responses/ValidationError"

  /boards/join:
    post:
      tags: [Boards]
      operationId: joinBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 16
      responses:
        "200":
          description: Membership created or existing membership returned idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "400":
          $ref: "#/components/responses/InvalidInvitation"

  /boards/{boardId}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [Boards]
      operationId: getBoard
      responses:
        "200":
          description: Board details for a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "404":
          $ref: "#/components/responses/NotFound"

  /boards/{boardId}/invitation-code:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [Boards]
      operationId: getInvitationCode
      responses:
        "200":
          description: Current code or a newly rotated code if the previous one expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCode"
        "404":
          $ref: "#/components/responses/NotFound"

  /boards/{boardId}/people:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [People]
      operationId: listBoardPeople
      parameters:
        - name: include_retired
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Account members and guest participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoardPerson"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [People]
      operationId: createGuestParticipant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "201":
          description: Guest participant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardPerson"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /boards/{boardId}/people/{personId}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/PersonId"
    patch:
      tags: [People]
      operationId: renameGuestParticipant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, version]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                version:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Guest participant renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardPerson"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [People]
      operationId: retireGuestParticipant
      parameters:
        - $ref: "#/components/parameters/Version"
      responses:
        "204":
          description: Guest retired from future expenses; history preserved
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /boards/{boardId}/expenses:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [Expenses]
      operationId: listExpenses
      parameters:
        - $ref: "#/components/parameters/Month"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated expenses ordered by date descending, creation descending, then ID ascending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpensePage"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Expenses]
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Expense and authoritative distribution created atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /boards/{boardId}/expenses/{expenseId}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/ExpenseId"
    get:
      tags: [Expenses]
      operationId: getExpense
      responses:
        "200":
          description: Expense detail, shares and debts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Expenses]
      operationId: updateExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ExpenseInput"
                - type: object
                  required: [version]
                  properties:
                    version:
                      type: integer
                      minimum: 1
      responses:
        "200":
          description: Expense replaced and all derived values recalculated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Expenses]
      operationId: deleteExpense
      parameters:
        - $ref: "#/components/parameters/Version"
      responses:
        "204":
          description: Expense deleted after client-side member confirmation
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /boards/{boardId}/audio-proposals:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    post:
      tags: [Audio]
      operationId: createAudioProposal
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: Supported WAV, MP3, M4A/MP4, WebM or Ogg; max 15 MB and 60 seconds
      responses:
        "200":
          description: Editable transient proposal; no expense has been created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioProposal"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Audio exceeds size or duration limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: Transcription temporarily unavailable; no financial state changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /boards/{boardId}/months/{month}/budget:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/MonthPath"
    put:
      tags: [Monthly]
      operationId: upsertMonthlyBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_ars]
              properties:
                base_ars:
                  $ref: "#/components/schemas/NonNegativeMoney"
                version:
                  type: [integer, "null"]
                  minimum: 1
                  description: Null when creating; required current value when updating
      responses:
        "200":
          description: Budget created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyBudget"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /boards/{boardId}/months/{month}/summary:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/MonthPath"
    get:
      tags: [Monthly]
      operationId: getMonthlySummary
      responses:
        "200":
          description: Authoritative monthly consumption, remainder and category breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlySummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /boards/{boardId}/savings:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [Savings]
      operationId: getSavingsSummary
      parameters:
        - $ref: "#/components/parameters/Month"
      responses:
        "200":
          description: Initial savings, total savings and purchases for the optional month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavingsSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /boards/{boardId}/savings/initial:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    put:
      tags: [Savings]
      operationId: upsertInitialSavings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_usd]
              properties:
                amount_usd:
                  $ref: "#/components/schemas/NonNegativeMoney"
                version:
                  type: [integer, "null"]
                  minimum: 1
      responses:
        "200":
          description: Initial savings created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitialSavings"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Savings]
      operationId: deleteInitialSavings
      parameters:
        - $ref: "#/components/parameters/Version"
      responses:
        "204":
          description: Initial savings deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /boards/{boardId}/usd-purchases:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [Savings]
      operationId: listUsdPurchases
      parameters:
        - $ref: "#/components/parameters/Month"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated USD purchases ordered by purchase date descending, creation descending, then ID ascending
          content:
            application/json:
              schema:
                type: object
                required: [items, page, page_size, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/UsdPurchase"
                  page:
                    type: integer
                  page_size:
                    type: integer
                  total:
                    type: integer
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Savings]
      operationId: createUsdPurchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsdPurchaseInput"
      responses:
        "201":
          description: USD purchase created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsdPurchase"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /boards/{boardId}/usd-purchases/{purchaseId}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/PurchaseId"
    put:
      tags: [Savings]
      operationId: updateUsdPurchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/UsdPurchaseInput"
                - type: object
                  required: [version]
                  properties:
                    version:
                      type: integer
                      minimum: 1
      responses:
        "200":
          description: USD purchase updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsdPurchase"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Savings]
      operationId: deleteUsdPurchase
      parameters:
        - $ref: "#/components/parameters/Version"
      responses:
        "204":
          description: USD purchase deleted and monthly totals recalculated
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  parameters:
    BoardId:
      name: boardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PurchaseId:
      name: purchaseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MonthPath:
      name: month
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Month"
    Month:
      name: month
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Month"
    Version:
      name: version
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    Unauthorized:
      description: Missing, invalid, expired or revoked session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource unavailable; also used uniformly for foreign-board resources
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Duplicate identity or stale resource version
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request or domain validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidToken:
      description: Recovery token is invalid, expired or already used
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidInvitation:
      description: Invitation code is invalid or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    UUID:
      type: string
      format: uuid
    Money:
      type: string
      pattern: "^[0-9]+\\.[0-9]{2}$"
      examples: ["30000.00"]
    NonNegativeMoney:
      allOf:
        - $ref: "#/components/schemas/Money"
      examples: ["0.00", "500000.00"]
    Month:
      type: string
      pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      examples: ["2026-01"]
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        field_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    RegisterRequest:
      type: object
      required: [display_name, email, password]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    User:
      type: object
      required: [id, display_name, email]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        display_name:
          type: string
        email:
          type: string
          format: email
    Board:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
    InvitationCode:
      type: object
      required: [code, issued_at, expires_at]
      properties:
        code:
          type: string
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    BoardPerson:
      type: object
      required: [id, kind, display_name, active, version]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        kind:
          type: string
          enum: [account, guest]
        display_name:
          type: string
        email:
          type: [string, "null"]
          format: email
          description: Included only for account-name disambiguation
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
    ExpenseType:
      type: string
      enum: [personal, equal, custom]
    Category:
      type: string
      enum: [food, transport, housing, services, health, education, leisure, other]
      description: Alimentos, Transporte, Vivienda, Servicios, Salud, Educación, Ocio y Otros, respectivamente
    CustomShareInput:
      type: object
      required: [person_id, amount_ars]
      properties:
        person_id:
          $ref: "#/components/schemas/UUID"
        amount_ars:
          $ref: "#/components/schemas/Money"
    ExpenseInput:
      type: object
      required: [name, amount_ars, category, payer_person_id, expense_type, participant_person_ids]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        amount_ars:
          $ref: "#/components/schemas/Money"
        category:
          $ref: "#/components/schemas/Category"
        expense_date:
          type: [string, "null"]
          format: date
          description: Null uses the current date in Argentina
        payer_person_id:
          $ref: "#/components/schemas/UUID"
        expense_type:
          $ref: "#/components/schemas/ExpenseType"
        participant_person_ids:
          type: array
          minItems: 1
          uniqueItems: true
          description: Stable selection order used for equal residual cents
          items:
            $ref: "#/components/schemas/UUID"
        custom_shares:
          type: array
          description: Required only for custom type; order matches participant order
          items:
            $ref: "#/components/schemas/CustomShareInput"
        description:
          type: [string, "null"]
          maxLength: 1000
    ExpenseShare:
      type: object
      required: [person, amount_ars, selection_order]
      properties:
        person:
          $ref: "#/components/schemas/BoardPerson"
        amount_ars:
          $ref: "#/components/schemas/Money"
        selection_order:
          type: integer
          minimum: 0
    Debt:
      type: object
      required: [debtor_person, creditor_person, amount_ars]
      properties:
        debtor_person:
          $ref: "#/components/schemas/BoardPerson"
        creditor_person:
          $ref: "#/components/schemas/BoardPerson"
        amount_ars:
          $ref: "#/components/schemas/Money"
    Expense:
      type: object
      required: [id, name, amount_ars, category, expense_date, payer, expense_type, shares, debts, version]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        amount_ars:
          $ref: "#/components/schemas/Money"
        category:
          $ref: "#/components/schemas/Category"
        expense_date:
          type: string
          format: date
        payer:
          $ref: "#/components/schemas/BoardPerson"
        expense_type:
          $ref: "#/components/schemas/ExpenseType"
        description:
          type: [string, "null"]
        shares:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseShare"
        debts:
          type: array
          items:
            $ref: "#/components/schemas/Debt"
        version:
          type: integer
          minimum: 1
    ExpensePage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    AudioAmbiguity:
      type: object
      required: [field, source_text, candidate_ids]
      properties:
        field:
          type: string
        source_text:
          type: string
        candidate_ids:
          type: array
          items:
            $ref: "#/components/schemas/UUID"
    AudioProposal:
      type: object
      required: [fields, missing_fields, ambiguities, warnings]
      properties:
        transcript:
          type: [string, "null"]
        fields:
          type: object
          properties:
            name:
              type: [string, "null"]
            amount_ars:
              oneOf:
                - $ref: "#/components/schemas/Money"
                - type: "null"
            category:
              oneOf:
                - $ref: "#/components/schemas/Category"
                - type: "null"
            expense_date:
              type: [string, "null"]
              format: date
            description:
              type: [string, "null"]
            expense_type:
              oneOf:
                - $ref: "#/components/schemas/ExpenseType"
                - type: "null"
            payer_person_id:
              type: [string, "null"]
              format: uuid
            participant_person_ids:
              type: array
              items:
                $ref: "#/components/schemas/UUID"
            custom_shares:
              type: array
              items:
                $ref: "#/components/schemas/CustomShareInput"
        missing_fields:
          type: array
          items:
            type: string
        ambiguities:
          type: array
          items:
            $ref: "#/components/schemas/AudioAmbiguity"
        warnings:
          type: array
          items:
            type: string
    MonthlyBudget:
      type: object
      required: [month, base_ars, version]
      properties:
        month:
          $ref: "#/components/schemas/Month"
        base_ars:
          $ref: "#/components/schemas/NonNegativeMoney"
        version:
          type: integer
          minimum: 1
    CategoryTotal:
      type: object
      required: [category, amount_ars, basis_points]
      properties:
        category:
          $ref: "#/components/schemas/Category"
        amount_ars:
          $ref: "#/components/schemas/NonNegativeMoney"
        basis_points:
          type: integer
          minimum: 0
          maximum: 10000
          description: Visual proportion only; amount_ars remains authoritative
    MonthlySummary:
      type: object
      required: [month, base_ars, consumed_ars, remaining_ars, category_totals]
      properties:
        month:
          $ref: "#/components/schemas/Month"
        base_ars:
          type: [string, "null"]
          pattern: "^[0-9]+\\.[0-9]{2}$"
        consumed_ars:
          $ref: "#/components/schemas/NonNegativeMoney"
        remaining_ars:
          type: [string, "null"]
          pattern: "^-?[0-9]+\\.[0-9]{2}$"
          description: Null when no base is configured
        category_totals:
          type: array
          items:
            $ref: "#/components/schemas/CategoryTotal"
    InitialSavings:
      type: object
      required: [amount_usd, version]
      properties:
        amount_usd:
          $ref: "#/components/schemas/NonNegativeMoney"
        version:
          type: integer
          minimum: 1
    UsdPurchaseInput:
      type: object
      required: [amount_usd, ars_spent]
      properties:
        amount_usd:
          $ref: "#/components/schemas/Money"
        ars_spent:
          $ref: "#/components/schemas/Money"
        purchase_date:
          type: [string, "null"]
          format: date
          description: Null uses the current date in Argentina
    UsdPurchase:
      type: object
      required: [id, amount_usd, ars_spent, purchase_date, version]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        amount_usd:
          $ref: "#/components/schemas/Money"
        ars_spent:
          $ref: "#/components/schemas/Money"
        purchase_date:
          type: string
          format: date
        version:
          type: integer
          minimum: 1
    SavingsSummary:
      type: object
      required: [initial_savings, total_usd, purchases]
      properties:
        initial_savings:
          oneOf:
            - $ref: "#/components/schemas/InitialSavings"
            - type: "null"
        total_usd:
          $ref: "#/components/schemas/NonNegativeMoney"
        purchases:
          type: array
          items:
            $ref: "#/components/schemas/UsdPurchase"
